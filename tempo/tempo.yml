stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 168h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

metrics_generator:
  processor:
    service_graphs:
      dimensions:
        - http.method
        - http.route
    span_metrics:
      dimensions:
        - http.method
        - http.route
        - http.status_code
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/metrics
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    compaction:
      block_retention: 168h
    metrics_generator:
      processors: [service-graphs, span-metrics]
